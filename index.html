<style>

:root{--cream:#fff8e7;--mint:#d3f0e0;--mint-d:#a9dcc2;--leaf:#7cc47f;--leaf-d:#3f8f5a;--butter:#ffe9a8;--rose:#ffd3de;--rose-d:#e87fa0;--wood:#c19a6b;--wood-d:#7a5230;--ink:#4a3b2c;--ink-2:#7d6a55;--card:#fffdf6;--line:#ecdcbc;--sky:#bfe8ff;--bad:#e5586b;

#modal{position:fixed;inset:0;background:#4a3b2c88;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--cream);border:3px solid var(--wood);border-radius:26px;width:100%;max-width:760px;max-height:100%;overflow:auto;padding:18px 18px 22px;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}}
.sheet .x{position:sticky;float:right;top:0;width:36px;height:36px;border-radius:12px;background:var(--rose);font-size:16px;z-index:3;margin:-4px -4px 0 8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}

#start{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,#dff5e8,#fff6dc 60%,#ffe4ea);padding:max(18px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 30px max(14px,env(safe-area-inset-left,0px))}

.sn{--o:0}

function gPuzzle(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe8ff"/><stop offset="1" stop-color="#fff3c9"/></linearGradient></defs><rect width="300" height="300" fill="url(#s)"/><circle cx="240" cy="50" r="26" fill="#ffd93d"/><path d="M0 190 Q80 140 160 185 T300 170 V300 H0Z" fill="#8fd47a"/><path d="M0 240 Q100 205 200 240 T300 230 V300 H0Z" fill="#5fb066"/><rect x="62" y="170" width="22" height="50" rx="8" fill="#fff4dc"/><path d="M30 175 Q73 110 116 175Z" fill="#e9494e"/><circle cx="60" cy="158" r="7" fill="#fff"/><circle cx="85" cy="150" r="6" fill="#fff"/><circle cx="98" cy="168" r="4" fill="#fff"/><rect x="190" y="190" width="16" height="40" rx="6" fill="#fff4dc"/><path d="M168 195 Q198 148 228 195Z" fill="#ff9ec4"/><circle cx="188" cy="183" r="5" fill="#fff"/><circle cx="208" cy="180" r="4" fill="#fff"/><rect x="132" y="225" width="12" height="30" rx="5" fill="#fff4dc"/><path d="M112 230 Q138 196 164 230Z" fill="#ffb347"/><circle cx="132" cy="220" r="4" fill="#fff"/><g fill="#fff"><circle cx="30" cy="255" r="6"/><circle cx="260" cy="262" r="6"/></g><circle cx="30" cy="255" r="3" fill="#ffd93d"/><circle cx="260" cy="262" r="3" fill="#ffd93d"/><text x="150" y="278" font-size="26" text-anchor="middle">🐌</text></svg>`;
 const url=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;let a=[0,1,2,3,4,5,6,7,8],bl=8,mv=0,done=false;
 const nb=i=>[i%3>0?i-1:-1,i%3<2?i+1:-1,i>2?i-3:-1,i<6?i+3:-1].filter(v=>v>=0);let prev=-1;for(let k=0;k<90;k++){const o=nb(bl).filter(v=>v!==prev);const m=pick(o);prev=bl;[a[bl],a[m]]=[a[m],a[bl]];bl=m}
 if(a.every((v,i)=>v===i)){[a[0],a[1]]=[a[1],a[0]];}
 gShell('puzzle',`<div class="pill" id="pm">Ходов: 0</div><div class="pz" id="pz"></div><div class="row"><div style="width:70px;aspect-ratio:1;border-radius:10px;background:${url} center/cover;border:2px solid var(--wood)"></div><span class="sub" style="margin:0">Образец. Двигай плитки в пустое место.</span></div>`);
 const draw=()=>{$('#pz').innerHTML=a.map((v,i)=>v===8&&!done?`<div class="blank"></div>`:`<div data-i="${i}" style="background-image:${url};background-position:${v%3*50}% ${Math.floor(v/3)*50}%"></div>`).join('');$$('#pz div[data-i]').forEach(d=>d.onclick=()=>{if(done)return;const i=+d.dataset.i;if(nb(i).includes(a.indexOf(8))){const b=a.indexOf(8);[a[i],a[b]]=[a[b],a[i]];mv++;A.sfx('flip');$('#pm').textContent='Ходов: '+mv;if(a.every((v,k)=>v===k)){done=true;draw();setTimeout(()=>finishGame('puzzle',clamp(1-(mv-30)/100,.6,1),`Картинка собрана за ${mv} ходов.`),700)}else draw()}})};draw()}
/* ---------- 5. НАЙДИ ПАРУ ---------- */
function gMemory(){const em=shuffle(Object.keys(FOODS).filter(k=>FOODS[k].c==='veg'||FOODS[k].c==='fruit')).slice(0,8),cards=shuffle([...em,...em]);let open=[],mv=0,got=0,lock=false;
 gShell('memory','<div class="pill" id="mm">Ходов: 0</div><div class="mem" id="mg"></div>');
 $('#mg').innerHTML=cards.map((k,i)=>`<button class="mcard" data-i="${i}" aria-label="Карточка"><div class="f">?</div><div class="b">${FD(k)}</div></button>`).join('');
 $$('.mcard').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(lock||b.classList.contains('up')||b.classList.contains('got'))return;b.classList.add('up');A.sfx('flip');open.push(i);
  if(open.length===2){mv++;$('#mm').textContent='Ходов: '+mv;lock=true;const [p,q]=open,bp=$$('.mcard')[p],bq=$$('.mcard')[q];
   if(cards[p]===cards[q]){bp.classList.add('got');bq.classList.add('got');got++;open=[];lock=false;A.sfx('coin');if(got===8)setTimeout(()=>finishGame('memory',clamp(1-(mv-8)/16,.4,1),`Все пары найдены за ${mv} ходов.`),600)}
   else setTimeout(()=>{bp.classList.remove('up');bq.classList.remove('up');open=[];lock=false},800)}})}
/* ---------- 6. ГОНКА УЛИТОК ---------- */
function gRace(){const me=P().sp,others=shuffle(SPK.filter(k=>k!==me)).slice(0,3);const ids=[me,...others];
 gShell('race',`<div class="big" id="rc">3</div><div class="lanes">${ids.map((k,i)=>`<div class="lane"><div class="rs" id="r${i}" style="width:62px">${snailSVG(k,{face:i?'normal':'happy'}).replace('class="sn"','class="sn crawl"')}</div></div>`).join('')}</div><button class="btn rose" id="tap" style="font-size:26px;padding:16px 50px" disabled>ТАП-ТАП!</button><p class="sub">Жми кнопку или пробел как можно быстрее!</p>`);
 const lvl=Math.min(S.lvl,12),base=[9.2,9.8,10.4].map(v=>v+lvl*.08),pos=[0,0,0,0];let state=0,fin=[],stop=false,last=performance.now(),tm;
 const draw=()=>pos.forEach((p,i)=>{$('#r'+i).style.left=`calc((100% - 66px) * ${Math.min(100,p)/100})`});
 const tapf=()=>{if(state===1&&pos[0]<100){pos[0]+=2.1;A.sfx('flip')}};$('#tap').onclick=tapf;const off=keyOn(e=>{if(e.code==='Space'){e.preventDefault();tapf()}});
 const loop=n=>{if(stop)return;requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;if(state!==1)return;
  for(let i=1;i<4;i++){if(pos[i]<100){pos[i]+=base[i-1]*dt*(.75+Math.random()*.5);if(pos[i]>=100&&!fin.includes(i))fin.push(i)}}
  if(pos[0]>=100&&!fin.includes(0))fin.push(0);draw();
  if(fin.includes(0)){state=2;stop=true;const rank=fin.indexOf(0)+1;setTimeout(()=>finishGame('race',[1,.75,.5,.3][rank-1],`Твоё место: ${rank} из 4.`),500)}};
 gameStop=()=>{stop=true;off();clearInterval(tm)};
 let c=3;tm=setInterval(()=>{c--;if(c>0){$('#rc').textContent=c;A.sfx('tap')}else{clearInterval(tm);$('#rc').textContent='СТАРТ!';state=1;$('#tap').disabled=false;A.sfx('win');last=performance.now();requestAnimationFrame(loop)}},900)}
/* ---------- 7. УЮТНЫЙ ДОМИК ---------- */
function gCozy(){const IT=[['🍄','гриб'],['🌸','цветок'],['🌻','цветок'],['🪨','камень'],['🌿','зелень'],['🍀','зелень'],['🪵','бревно'],['🏮','фонарик']],CAT={'гриб':'грибное','цветок':'цветущее','камень':'каменное','зелень':'зелёное','бревно':'деревянное','фонарик':'светящееся'};let round=0,tot=0;
 const rd=()=>{round++;const wish=shuffle(Object.keys(CAT)).slice(0,3),sel=[];gShell('cozy',`<div class="pill" style="font-size:15px">Раунд ${round} из 2</div><p style="text-align:center;font-weight:800;margin:0">Улитка мечтает об уголке, где будет что-то <b>${wish.map(w=>CAT[w]).join('</b>, что-то <b>')}</b>.</p><div class="row" id="sl" style="min-height:64px;font-size:44px;justify-content:center;background:#fff;border-radius:16px;border:2px dashed var(--line);padding:6px 16px;width:100%"></div><div class="grid" id="ci" style="width:100%"></div><button class="btn" id="cdo" disabled>Украсить</button>`);
  $('#ci').innerHTML=shuffle(IT).map(it=>`<button class="it" data-e="${it[0]}" data-c="${it[1]}"><span class="e">${it[0]}</span></button>`).join('');
  $$('#ci .it').forEach(b=>b.onclick=()=>{const i=sel.findIndex(s=>s.e===b.dataset.e);if(i>=0){sel.splice(i,1);b.classList.remove('sel')}else if(sel.length<3){sel.push({e:b.dataset.e,c:b.dataset.c});b.classList.add('sel');A.sfx('pop')}$('#sl').textContent=sel.map(s=>s.e).join(' ');$('#cdo').disabled=sel.length!==3});
  $('#cdo').onclick=()=>{const cats=new Set(sel.map(s=>s.c)),m=wish.filter(w=>cats.has(w)).length;tot+=m/3;A.sfx(m===3?'win':'tap');toast(m===3?'Идеально уютно! 💚':`Совпало желаний: ${m} из 3`,m===3?'':'bad');if(round<2)setTimeout(rd,700);else setTimeout(()=>{P().mood=clamp(P().mood+5);finishGame('cozy',tot/2,'Уголок готов!')},700)}};rd()}

const ACTS=[['feed','🍃','Покормить',()=>feedPanel()],['play','🎮','Играть',()=>playPanel()],['care','🧼','Уход',()=>carePanel()],['vet','🩺','Ветеринар',()=>vetPanel(),'dotVet'],['shop','🛒','Магазин',()=>shopPanel()],['sleep','🌙','Уложить спать',()=>toggleSleep(),'','btnSleep'],['quest','📋','Задания',()=>questPanel(),'dotQ'],['diary','📖','Дневник',()=>diaryPanel()]];

let pickSp='garden';
function startScreen(){const g=$('#spGrid');

 $$('.sp').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!SP[k].free){toast(SP[k].limited?'Лимитированная улитка: только по одноразовому коду 🎟️':'Редкую улитку можно открыть позже: '+reqText(k).toLowerCase()+'. Сначала заведи обычную 🌱');return}pickSp=k;$$('.sp').forEach(x=>x.classList.toggle('sel',x===b));$('#nameIn').placeholder=SP[k].n;A.init();A.sfx('pop')});

function catchUp(){const p=P(),now=Date.now(),gap=now-p.last;if(gap<120000){advance(p,gap,false);return}
 const b={hunger:p.hunger,energy:p.energy,mood:p.mood,clean:p.clean,hum:p.hum};advance(p,gap,true);p.last=now;dayRoll();
 if(gap>10*60000){const h=Math.floor(gap/H),m=Math.floor(gap%H/60000);const d=(k,n)=>{const v=Math.round(p[k]-b[k]);return`<span class="pill">${n} ${v>0?'+':''}${v}%</span>`};
  modal(`<h2>С возвращением! 💚</h2><p class="sub">Тебя не было ${h?h+' ч ':''}${m} мин. ${p.name} ${p.sleep?'сейчас спит.':'скучала, но держалась.'}</p><div class="row">${d('hunger','🍃')}${d('energy','⚡')}${d('mood','😊')}${d('clean','🧼')}${d('hum','💧')}</div><p class="sub" style="margin-top:12px">Показатели менялись постепенно. С улиткой ничего страшного не случилось.</p><button class="btn" id="wb">Продолжить</button>`);$('#wb').onclick=closeModal}}

 checkAch();fxInit();SS.skey='';SS.sig='';SS.lastSleep=null;render();save();
 if(first){setTimeout(()=>say('Привет! Я '+P().name+'! 💚',4000),600);setTimeout(()=>toast('Нажми «Покормить»: угадай, что любит твоя улитка 🍃'),1500)}
 setTimeout(wander,2500);if(!initGame.on){initGame.on=true;setInterval(loop,1000);setInterval(save,10000);setInterval(idleSay,28000)}}
